.hero .in{max-width:1000px;margin:auto;position:relative;z-index:2}
.hero img.lg{height:54px;display:block;margin-bottom:34px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.25;font-weight:800}
.hero p{font-size:clamp(16px,2.2vw,21px);max-width:680px;margin-top:16px;opacity:.9}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 18px;border-radius:40px;font-size:15px}
.meta b{color:var(--y)}
.sq{position:absolute;width:46px;height:46px;background:var(--y);opacity:.9;animation:glow 4s ease-in-out infinite}
.sq.a{top:60px;left:8%}.sq.b{top:150px;left:18%;width:26px;height:26px;animation-delay:1.3s}.sq.c{bottom:130px;left:5%;width:34px;height:34px;animation-delay:2.4s}
@keyframes glow{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-10px)}}
main{max-width:1000px;margin:-96px auto 0;padding:0 20px 60px;position:relative;z-index:3}
.track{background:var(--card);border-radius:22px;padding:22px 22px 26px;box-shadow:0 18px 50px rgba(1,47,77,.22)}
.bar{display:flex;gap:6px;height:14px;position:relative;margin:6px 0 16px}
.bar i{display:block;border-radius:8px;background:var(--line);transition:background .4s,transform .4s;cursor:pointer}
.bar i.on{background:var(--y);transform:scaleY(1.5)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tab{font:inherit;color:inherit;text-align:right;background:transparent;border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .3s,background .3s,transform .3s}
.tab:hover{transform:translateY(-3px);border-color:var(--y)}
.tab:focus-visible,.f:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.tab[aria-selected=true]{background:var(--b);border-color:var(--b);color:#fff}
.tab small{display:block;opacity:.75;font-size:13px}.tab b{display:block;font-size:clamp(15px,2.4vw,20px);line-height:1.5;font-weight:800}
.tab span{font-size:12px;color:var(--y);font-weight:800}
#panel{margin-top:30px}
.ph{background:var(--b);color:#fff;border-radius:22px;padding:30px;position:relative;overflow:hidden;animation:in .6s cubic-bezier(.2,.8,.2,1)}
.ph h2{font-size:clamp(26px,4.5vw,42px);line-height:1.35;font-weight:800}
.ph p{opacity:.9;margin-top:6px}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}.stats div{font-size:14px;opacity:.9}.stats b{display:block;font-size:28px;color:var(--y);line-height:1.2}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
.f{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1.5px solid var(--line);padding:4px 16px;border-radius:30px;cursor:pointer;transition:.25s}
.f[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#012f4d;font-weight:800}
.tl{position:relative;margin-top:14px;padding-right:0}
.tl:before{content:"";position:absolute;right:62px;top:0;bottom:0;width:3px;background:var(--line);border-radius:3px}
.it{display:grid;grid-template-columns:62px 1fr;gap:26px;margin-bottom:18px;opacity:0;transform:translateX(24px);animation:in .55s cubic-bezier(.2,.8,.2,1) forwards;position:relative}
.it.h{display:none}
.d{text-align:center;font-weight:800;line-height:1.3;font-size:15px;padding-top:14px}.d small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.d:after{content:"";position:absolute;right:56px;top:20px;width:15px;height:15px;background:var(--y);border:3px solid var(--bg);border-radius:4px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;transition:transform .3s,box-shadow .3s}
.cd:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(1,47,77,.15)}
.ty{display:inline-block;font-size:12.5px;font-weight:800;padding:1px 14px;border-radius:20px;background:var(--y);color:#012f4d}
.it[data-t="فيديو"] .ty,.it[data-t="ريل"] .ty{background:var(--b);color:#fff}
.it[data-t="مقترح"] .ty{background:transparent;border:1.5px dashed var(--mut);color:var(--mut)}
.cd h3{font-size:19px;margin:6px 0 2px;color:var(--hl);font-weight:800}
.cd p{font-size:15.5px;color:var(--tx)}.cd p.sc{font-size:14.5px;color:var(--mut)}
.cta{margin-top:12px;background:var(--y);color:#012f4d;font-weight:800;border-radius:12px;padding:10px 16px;font-size:15.5px}
.nt{margin-top:12px;border-right:4px solid var(--y);padding:2px 14px;font-size:14px;color:var(--mut)}

["الأربع","28/10","ريل","لما يغيب الدفا","شخص بيتكلم ويقول: «الدفا أشكال كتير. دايمًا لما بتخيل كلمة دفا بتخيل أشكال كتيرة، زي البيت، فنجان القهوة، وجبة دافية، بطانية، لبس الشتا. نِعَم بسيطة ومعتادة لكن أثرها في حياتنا كبير. وفي نوع تاني من الدفا: دفا القلوب، دفا الإنسانية والإحساس بالغير والعطاء، الدفا اللي بتحسه لما نشارك النعم دي ونتقاسمها مع الناس المحرومة منها. عارفين إن في فئة كبيرة وأسر مستحقة نسيت كلمة دفا، بيعيشوا شتا قاسي جدًا: لا مأوى، ولا لبس، ولا غطا يدفي، ولا حتى وجبة سخنة تدفيهم.»","","بعد كده نشرح: دفا وأمان صناع الخير بنقدم إيه؟"],
